[project]
name = "software-automation-mcp"
version = "0.5.3"
description = "Open-source Windows RPA and MCP server for desktop UIA, browser DOM, ERP, and AI agent automation"
readme = "README.md"
license = "MIT"
authors = [{ name = "Lingheyi Intelligence" }]
keywords = [
  "mcp",
  "mcp-server",
  "model-context-protocol",
  "rpa",
  "robotic-process-automation",
  "ai-agent",
  "computer-use",
  "windows-automation",
  "desktop-automation",
  "ui-automation",
  "uiautomation",
  "browser-automation",
  "erp-automation",
]
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp[cli]>=2.0,<3",
  "pynput>=1.8,<2",
  "uiautomation>=2.0,<3; sys_platform == 'win32'",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
packaging = [
    "pyinstaller>=6.16,<7",
]

[project.urls]
Homepage = "https://github.com/guangfubill-crypto/SoftAuto-MCP"
Repository = "https://github.com/guangfubill-crypto/SoftAuto-MCP"
Issues = "https://github.com/guangfubill-crypto/SoftAuto-MCP/issues"

[project.scripts]
softauto-inspector = "softauto.picker:main"
softauto-picker = "softauto.picker:main"
softauto-flauinspect = "softauto.flauinspect:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/softauto"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
